services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormitory}
      POSTGRES_USER: ${POSTGRES_USER:-dormitory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dormitory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dormitory}
      DB_USER: ${POSTGRES_USER:-dormitory}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      RECEIPTS_DIR: /data/receipts
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - receipts:/data/receipts

  backup:
    image: postgres:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/scripts/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormitory}
      POSTGRES_USER: ${POSTGRES_USER:-dormitory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Kyiv
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups
      - receipts:/receipts:ro

  web:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  receipts:
