spring:
  application:
    name: dormitory
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:dormitory}}
    username: ${DB_USER:${POSTGRES_USER:dormitory}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:dormitory}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # схема змінюється лише міграціями Flyway
    properties:
      hibernate.jdbc.time_zone: Europe/Kyiv
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:admin@localhost}
    password: ${ADMIN_PASSWORD:}
  storage:
    receipts-dir: ${RECEIPTS_DIR:./uploads/receipts}

management:
  endpoints:
    web:
      exposure:
        include: health