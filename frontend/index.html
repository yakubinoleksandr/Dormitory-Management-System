<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управління гуртожитком — ІС</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .fade-in { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 flex flex-col md:flex-row min-h-screen font-sans text-slate-800">

  <!-- Бокове навігаційне меню (ховається на екрані входу) -->
  <aside id="sidebar" class="hidden w-full md:w-64 bg-slate-900 text-white shadow-xl flex-col shrink-0 transition-all duration-300">
    <div class="p-4 border-b border-slate-700 flex items-center gap-3">
      <div class="bg-blue-600 p-2 rounded-lg shadow-sm">
        <i class="fa-solid fa-building text-white"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight">Гуртожиток КС</h1>
        <p class="text-xs text-slate-400">Система управління</p>
      </div>
    </div>

    <nav id="nav" class="flex-1 p-4 space-y-1.5 overflow-y-auto"></nav>

    <div class="p-4 border-t border-slate-700">
      <button id="logout" class="flex items-center gap-3 text-slate-400 hover:text-white transition-colors w-full p-2.5 rounded-lg hover:bg-slate-800 text-sm font-medium">
        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
        <span>Вихід із системи</span>
      </button>
    </div>
  </aside>

  <!-- Основна робоча область -->
  <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
    <header id="topbar" class="hidden bg-white shadow-sm px-6 py-4 justify-between items-center shrink-0 z-10 border-b border-slate-100">
      <h2 id="pageTitle" class="text-xl font-bold text-slate-800">Завантаження...</h2>
      <div class="flex items-center gap-3">
        <span id="roleBadge" class="text-sm font-medium text-slate-700 bg-slate-100 px-3.5 py-1.5 rounded-full border border-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-blue-600"></i>
          <span>Роль: ...</span>
        </span>
      </div>
    </header>

    <div class="p-6 overflow-y-auto flex-1">
      <div id="app" class="max-w-6xl mx-auto fade-in"></div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
